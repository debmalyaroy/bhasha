org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ABIs to build native code for. arm64-v8a is what phones run; add x86_64 to use the emulator:
#   gradlew assembleDebug -Pbhasha.abis=arm64-v8a,x86_64
bhasha.abis=arm64-v8a

# App version (MAJOR.MINOR.PATCH). A release is this value plus a matching git tag vX.Y.Z.
bhasha.version=0.1.0
