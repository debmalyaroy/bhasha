name: Release

# Pushing a tag vX.Y.Z builds the signed APK and publishes a GitHub release.
# The tag must match `bhasha.version` in gradle.properties.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version in gradle.properties
        run: |
          version=$(sed -n 's/^bhasha\.version=//p' gradle.properties)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match bhasha.version=$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## / { on = ($2 == v || $2 == "[" v "]") ; next }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate courses
        run: |
          python tools/build_courses.py
          git diff --exit-code -- app/src/main/assets/learn

      - uses: ./.github/actions/setup-android

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BHASHA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secret BHASHA_KEYSTORE_BASE64 is not set; refusing to publish an APK signed with a debug key"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          BHASHA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          BHASHA_KEYSTORE_PASSWORD: ${{ secrets.BHASHA_KEYSTORE_PASSWORD }}
          BHASHA_KEY_ALIAS: ${{ secrets.BHASHA_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify and name the APK
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="Bhasha-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$tools/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error::the APK is signed with a debug key"
            exit 1
          fi
          "$tools/zipalign" -c -P 16 4 "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "Bhasha-$VERSION.apk" "Bhasha-$VERSION.apk.sha256" \
            --title "Bhasha $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
